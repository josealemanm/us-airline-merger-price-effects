name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        # The estimators are checked against statsmodels and linearmodels, and
        # the merger simulation against closed-form logit results. Nothing here
        # touches the network: the 5 GB pull is not part of CI.
        run: pytest tests/ -q

      - name: Check every pipeline stage at least imports
        run: |
          python - <<'PY'
          import importlib.util, pathlib, sys
          sys.path.insert(0, "src")
          for p in sorted(pathlib.Path("src").glob("[0-9]*.py")):
              spec = importlib.util.spec_from_file_location(p.stem, p)
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              assert hasattr(mod, "main"), f"{p.name} has no main()"
              print(f"  ok  {p.name}")
          PY
